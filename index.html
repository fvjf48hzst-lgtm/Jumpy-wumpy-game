<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Pixel Quest</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #111;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;

    font-family: monospace;

    overflow: hidden;

    touch-action: none;
}

#gameContainer {
    position: relative;

    width: 960px;
    max-width: 100vw;
}

canvas {
    display: block;

    width: 100%;

    image-rendering: pixelated;
    image-rendering: crisp-edges;

    background: #5c94fc;

    touch-action: none;
}

#controls {
    position: absolute;

    bottom: 12px;
    left: 50%;

    transform: translateX(-50%);

    color: white;

    font-size: 14px;

    text-shadow: 2px 2px #000;

    pointer-events: none;

    white-space: nowrap;
}


/* =========================================================
   MOBILE MOVEMENT BUTTONS
   ========================================================= */

#mobileControls {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 20px;

    display: flex;

    justify-content: space-between;

    align-items: flex-end;

    padding: 0 20px;

    pointer-events: none;

    z-index: 20;
}


.controlGroup {

    display: flex;

    gap: 12px;

    pointer-events: auto;
}


.controlButton {

    width: 70px;
    height: 70px;

    border: 3px solid white;

    border-radius: 14px;

    background: rgba(0, 0, 0, 0.55);

    color: white;

    font-size: 30px;

    font-family: monospace;

    font-weight: bold;

    display: flex;

    justify-content: center;
    align-items: center;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;
}


.controlButton:active {

    background: rgba(255, 255, 255, 0.35);

    transform: scale(0.94);
}


@media (min-width: 800px) and (pointer: fine) {

    #mobileControls {
        display: none;
    }
}


@media (max-width: 600px) {

    #controls {
        display: none;
    }

    #mobileControls {

        bottom: 15px;

        padding: 0 12px;
    }

    .controlButton {

        width: 62px;
        height: 62px;

        font-size: 26px;
    }
}

</style>
</head>


<body>


<div id="gameContainer">

    <canvas
        id="game"
        width="960"
        height="540">
    </canvas>

    <div id="controls">
        ← → Move &nbsp;&nbsp; Tap Anywhere to Jump &nbsp;&nbsp; P Pause
    </div>

</div>


<!-- ONLY MOVEMENT BUTTONS -->

<div id="mobileControls">

    <div class="controlGroup">

        <button
            class="controlButton"
            id="leftButton">
            ◀
        </button>

        <button
            class="controlButton"
            id="rightButton">
            ▶
        </button>

    </div>

</div>


<script>

/* =========================================================
   PIXEL QUEST
   ========================================================= */


const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;


/* =========================================================
   GAME SETTINGS
   ========================================================= */

const WIDTH = canvas.width;

const HEIGHT = canvas.height;

const GRAVITY = 0.55;

const MAX_FALL_SPEED = 12;

const PLAYER_SPEED = 4.5;

const JUMP_POWER = 11.5;

let cameraX = 0;

let score = 0;

let coins = 0;

let lives = 3;

let gameState = "playing";

let keys = {};

let lastTime = 0;


/* =========================================================
   KEYBOARD CONTROLS
   ========================================================= */

document.addEventListener(
    "keydown",
    (e) => {

        keys[e.code] = true;


        if (
            e.code === "ArrowUp" ||
            e.code === "Space"
        ) {

            e.preventDefault();
        }


        if (
            e.code === "KeyP"
        ) {

            if (
                gameState === "playing"
            ) {

                gameState = "paused";

            } else if (
                gameState === "paused"
            ) {

                gameState = "playing";
            }
        }


        if (
            e.code === "KeyR" &&
            (
                gameState === "gameover" ||
                gameState === "won"
            )
        ) {

            restartGame();
        }

    }
);


document.addEventListener(
    "keyup",
    (e) => {

        keys[e.code] = false;

    }
);


/* =========================================================
   MOBILE LEFT / RIGHT BUTTONS
   ========================================================= */

const leftButton =
    document.getElementById(
        "leftButton"
    );

const rightButton =
    document.getElementById(
        "rightButton"
    );


/* LEFT */

function pressLeft(e) {

    e.preventDefault();

    keys["ArrowLeft"] = true;
}


function releaseLeft(e) {

    e.preventDefault();

    keys["ArrowLeft"] = false;
}


leftButton.addEventListener(
    "pointerdown",
    pressLeft
);

leftButton.addEventListener(
    "pointerup",
    releaseLeft
);

leftButton.addEventListener(
    "pointercancel",
    releaseLeft
);

leftButton.addEventListener(
    "pointerleave",
    releaseLeft
);


/* RIGHT */

function pressRight(e) {

    e.preventDefault();

    keys["ArrowRight"] = true;
}


function releaseRight(e) {

    e.preventDefault();

    keys["ArrowRight"] = false;
}


rightButton.addEventListener(
    "pointerdown",
    pressRight
);

rightButton.addEventListener(
    "pointerup",
    releaseRight
);

rightButton.addEventListener(
    "pointercancel",
    releaseRight
);

rightButton.addEventListener(
    "pointerleave",
    releaseRight
);


/* =========================================================
   TAP ANYWHERE TO JUMP
   ========================================================= */


/*
   IMPORTANT:

   The movement buttons are ignored here.

   Any tap/click on the game itself
   makes the player jump.

   This means there is NO jump button.
*/


function tapToJump(e) {

    /*
       Ignore taps on the movement buttons.
    */

    if (
        e.target === leftButton ||
        e.target === rightButton
    ) {

        return;
    }


    /*
       Only jump while actually playing.
    */

    if (
        gameState !== "playing"
    ) {

        return;
    }


    /*
       Only jump if touching the ground.
    */

    if (
        player.grounded
    ) {

        player.vy =
            -JUMP_POWER;

        player.grounded =
            false;
    }

}


/*
   pointerdown works on:

   - iPhone
   - iPad
   - Android
   - desktop mouse
   - touchscreen laptops
*/

canvas.addEventListener(
    "pointerdown",
    tapToJump
);


/* Prevent browser gestures */

canvas.addEventListener(
    "touchstart",
    (e) => {

        e.preventDefault();

    },
    { passive: false }
);

/* =========================================================

/* =========================================================

   ========================================================= */

const coinObjects = [];


function addCoin(x, y) {

    });

/* =========================================================

   ========================================================= */

    },

/* =========================================================

   ========================================================= */

const powerUps = [

/* =========================================================

/* =========================================================
   COLLISION
   ========================================================= */

function isColliding(a, b) {

    return (

        a.x <
        b.x + b.w &&

        a.x + a.width >
        b.x &&

        a.y <
        b.y + b.h &&

        a.y + a.height >
        b.y

    );
}


/* =========================================================
   RESET PLAYER
   ========================================================= */

function resetPlayer() {

    player.x = 100;

    player.y = 350;

    player.vx = 0;

    player.vy = 0;

    player.grounded = false;

    cameraX = 0;
}


/* =========================================================
   LOSE LIFE
   ========================================================= */

function loseLife() {

    if (
        player.invincible > 0
    ) {

        return;
    }


    lives--;


    if (
        lives <= 0
    ) {

        gameState =
            "gameover";

        return;
    }


    player.invincible =
        120;


    resetPlayer();
}


/* =========================================================
   PLAYER UPDATE
   ========================================================= */

function updatePlayer() {

    if (
        player.invincible > 0
    ) {

        player.invincible--;
    }


    /* Movement */

    if (
        keys["ArrowLeft"] ||
        keys["KeyA"]
    ) {

        player.vx =
            -PLAYER_SPEED;

        player.facing = -1;

    }

    else if (
        keys["ArrowRight"] ||
        keys["KeyD"]
    ) {

        player.vx =
            PLAYER_SPEED;

        player.facing = 1;

    }

    else {

        player.vx *= 0.75;
    }


    /* Keyboard jumping */

    if (

        (
            keys["Space"] ||
            keys["ArrowUp"] ||
            keys["KeyW"]
        )

        &&

        player.grounded

    ) {

        player.vy =
            -JUMP_POWER;

        player.grounded =
            false;
    }


    /* Gravity */

    player.vy += GRAVITY;


    if (
        player.vy >
        MAX_FALL_SPEED
    ) {

        player.vy =
            MAX_FALL_SPEED;
    }


    /* Horizontal */

    player.x +=
        player.vx;


    for (
        const platform of platforms
    ) {

        if (
            isColliding(
                player,
                platform
            )
        ) {

            if (
                player.vx > 0
            ) {

                player.x =
                    platform.x -
                    player.width;

            }

            else if (
                player.vx < 0
            ) {

                player.x =
                    platform.x +
                    platform.w;
            }


            player.vx = 0;
        }
    }


    /* Vertical */

    player.y +=
        player.vy;


    player.grounded =
        false;


    for (
        const platform of platforms
    ) {

        if (
            isColliding(
                player,
                platform
            )
        ) {

            if (
                player.vy > 0
            ) {

                player.y =
                    platform.y -
                    player.height;

                player.vy = 0;

                player.grounded =
                    true;

            }

            else if (
                player.vy < 0
            ) {

                player.y =
                    platform.y +
                    platform.h;

                player.vy = 0;
            }
        }
    }


    /* Fall */

    if (
        player.y >
        HEIGHT + 100
    ) {

        loseLife();
    }


    /* Camera */

    cameraX =
        player.x -
        WIDTH * 0.35;


    if (
        cameraX < 0
    ) {

        cameraX = 0;
    }


    const maxCamera =
        4200 - WIDTH;


    if (
        cameraX >
        maxCamera
    ) {

        cameraX =
            maxCamera;
    }
}


/* =========================================================
   ENEMIES
   ========================================================= */

function updateEnemies() {

    for (
        const enemy of enemies
    ) {

        if (
            !enemy.alive
        ) {

            continue;
        }


        enemy.x +=
            enemy.vx;


        for (
            const platform of platforms
        ) {

            if (

                enemy.x <=
                platform.x

                ||

                enemy.x + enemy.w >=
                platform.x +
                platform.w

            ) {

                if (
                    enemy.y +
                    enemy.h >=
                    platform.y - 2
                ) {

                    enemy.vx *= -1;

                    break;
                }
            }
        }


        if (
            isColliding(
                player,
                enemy
            )
        ) {

            if (

                player.vy > 0

                &&

                player.y +
                player.height -
                8 <
                enemy.y + 10

            ) {

                enemy.alive =
                    false;

                player.vy =
                    -7;

                score +=
                    100;

            }

            else {

                loseLife();
            }
        }
    }
}


/* =========================================================
   COINS
   ========================================================= */

function updateCoins() {

    for (
        const coin of coinObjects
    ) {

        if (
            coin.collected
        ) {

            continue;
        }


        coin.animation +=
            0.08;


        const coinBox = {

            x:
                coin.x -
                coin.radius,

            y:
                coin.y -
                coin.radius,

            w:
                coin.radius * 2,

            h:
                coin.radius * 2
        };


        if (
            isColliding(
                player,
                coinBox
            )
        ) {

            coin.collected =
                true;

            coins++;

            score +=
                50;
        }
    }
}


/* =========================================================
   POWER UPS
   ========================================================= */

function updatePowerUps() {

    for (
        const power of powerUps
    ) {

        if (
            power.collected
        ) {

            continue;
        }


        const box = {

            x: power.x,

            y: power.y,

            w: power.w,

            h: power.h
        };


        if (
            isColliding(
                player,
                box
            )
        ) {

            power.collected =
                true;

            player.powered =
                true;

            score +=
                500;
        }
    }
}


/* =========================================================
   BLOCKS
   ========================================================= */

function updateBlocks() {

    for (
        const block of blocks
    ) {

        if (
            block.type !== "coin"
        ) {

            continue;
        }


        const box = {

            x: block.x,

            y: block.y,

            w: block.w,

            h: block.h
        };


        if (
            isColliding(
                player,
                box
            )
        ) {

            if (
                player.vy < 0 &&
                player.y > block.y
            ) {

                block.type =
                    "used";

                coins++;

                score +=
                    50;

                player.vy =
                    1;
            }
        }
    }
}


/* =========================================================
   GOAL
   ========================================================= */

function checkGoal() {

    const goalBox = {

        x:
            goal.x - 15,

        y:
            goal.y,

        w: 50,

        h:
            goal.h
    };


    if (
        isColliding(
            player,
            goalBox
        )
    ) {

        gameState =
            "won";
    }
}


/* =========================================================
   UPDATE
   ========================================================= */

function update() {

    if (
        gameState !==
        "playing"
    ) {

        return;
    }


    updatePlayer();

    updateEnemies();

    updateCoins();

    updatePowerUps();

    updateBlocks();

    checkGoal();
}


/* =========================================================
   BACKGROUND
   ========================================================= */

function drawBackground() {

    ctx.fillStyle =
        "#5c94fc";


    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /* Clouds */

    for (
        const cloud of clouds
    ) {

        const x =
            cloud.x -
            cameraX * 0.3;

        const y =
            cloud.y;

        const s =
            cloud.scale;


        ctx.fillStyle =
            "#fff";


        ctx.fillRect(
            x,
            y,
            80 * s,
            25 * s
        );


        ctx.fillRect(
            x + 20 * s,
            y - 15 * s,
            45 * s,
            30 * s
        );


        ctx.fillRect(
            x + 50 * s,
            y - 10 * s,
            40 * s,
            25 * s
        );
    }


    /* Hills */

    ctx.fillStyle =
        "#62c94b";


    for (
        let i = -1;
        i < 12;
        i++
    ) {

        const x =
            i * 450 -
            (
                cameraX *
                0.2 %
                450
            );


        ctx.beginPath();


        ctx.arc(
            x + 150,
            480,
            150,
            Math.PI,
            0
        );


        ctx.fill();
    }
}


/* =========================================================
   PLATFORMS
   ========================================================= */

function drawPlatforms() {

    for (
        const platform of platforms
    ) {

        const x =
            platform.x -
            cameraX;

        const y =
            platform.y;


        ctx.fillStyle =
            "#55b52c";


        ctx.fillRect(
            x,
            y,
            platform.w,
            10
        );


        ctx.fillStyle =
            "#a95d25";


        ctx.fillRect(
            x,
            y + 10,
            platform.w,
            platform.h - 10
        );


        ctx.fillStyle =
            "#7f431b";


        for (
            let px = x + 10;
            px < x + platform.w;
            px += 35
        ) {

            ctx.fillRect(
                px,
                y + 22,
                10,
                8
            );
        }
    }
}


/* =========================================================
   BLOCKS
   ========================================================= */

function drawBlocks() {

    for (
        const block of blocks
    ) {

        const x =
            block.x -
            cameraX;

        const y =
            block.y;


        if (
            block.type ===
            "used"
        ) {

            ctx.fillStyle =
                "#777";


            ctx.fillRect(
                x,
                y,
                block.w,
                block.h
            );


            ctx.strokeStyle =
                "#444";


            ctx.strokeRect(
                x,
                y,
                block.w,
                block.h
            );


            continue;
        }


        if (
            block.type ===
            "coin"
        ) {

            ctx.fillStyle =
                "#e7a900";


            ctx.fillRect(
                x,
                y,
                block.w,
                block.h
            );


            ctx.fillStyle =
                "#ffe45c";


            ctx.fillRect(
                x + 8,
                y + 7,
                24,
                26
            );


            ctx.fillStyle =
                "#b87900";


            ctx.fillRect(
                x + 16,
                y + 11,
                8,
                18
            );

        }

        else {

            ctx.fillStyle =
                "#b85c30";


            ctx.fillRect(
                x,
                y,
                block.w,
                block.h
            );


            ctx.strokeStyle =
                "#6b321c";


            ctx.strokeRect(
                x,
                y,
                block.w,
                block.h
            );


            ctx.fillStyle =
                "#d77b43";


            ctx.fillRect(
                x + 4,
                y + 4,
                12,
                5
            );
        }
    }
}


/* =========================================================
   COINS
   ========================================================= */

function drawCoins() {

    for (
        const coin of coinObjects
    ) {

        if (
            coin.collected
        ) {

            continue;
        }


        const x =
            coin.x -
            cameraX;

        const y =
            coin.y;


        const squash =
            Math.abs(
                Math.sin(
                    coin.animation
                )
            );


        ctx.fillStyle =
            "#ffd83d";


        ctx.beginPath();


        ctx.ellipse(
            x,
            y,
            8 * squash + 3,
            11,
            0,
            0,
            Math.PI * 2
        );


        ctx.fill();


        ctx.fillStyle =
            "#fff08a";


        ctx.fillRect(
            x - 2,
            y - 7,
            3,
            6
        );
    }
}


/* =========================================================
   ENEMIES
   ========================================================= */

function drawEnemies() {

    for (
        const enemy of enemies
    ) {

        if (
            !enemy.alive
        ) {

            continue;
        }


        const x =
            enemy.x -
            cameraX;

        const y =
            enemy.y;


        ctx.fillStyle =
            "#9b3d28";


        ctx.fillRect(
            x,
            y + 8,
            enemy.w,
            20
        );


        ctx.fillStyle =
            "#d76b43";


        ctx.fillRect(
            x + 3,
            y,
            enemy.w - 6,
            15
        );


        ctx.fillStyle =
            "#fff";


        ctx.fillRect(
            x + 7,
            y + 5,
            5,
            5
        );


        ctx.fillRect(
            x + 20,
            y + 5,
            5,
            5
        );


        ctx.fillStyle =
            "#111";


        ctx.fillRect(
            x + 9,
            y + 6,
            3,
            4
        );


        ctx.fillRect(
            x + 20,
            y + 6,
            3,
            4
        );


        ctx.fillStyle =
            "#4b2118";


        ctx.fillRect(
            x - 3,
            y + 27,
            14,
            5
        );


        ctx.fillRect(
            x + 21,
            y + 27,
            14,
            5
        );
    }
}


/* =========================================================
   POWER UPS
   ========================================================= */

function drawPowerUps() {

    for (
        const power of powerUps
    ) {

        if (
            power.collected
        ) {

            continue;
        }


        const x =
            power.x -
            cameraX;

        const y =
            power.y;


        ctx.fillStyle =
            "#f5e642";


        ctx.fillRect(
            x,
            y,
            power.w,
            power.h
        );


        ctx.fillStyle =
            "#fff";


        ctx.fillRect(
            x + 5,
            y + 5,
            14,
            7
        );


        ctx.fillStyle =
            "#4bc45b";


        ctx.fillRect(
            x + 6,
            y + 14,
            12,
            7
        );
    }
}


/* =========================================================
   PLAYER
   ========================================================= */

function drawPlayer() {

    if (

        player.invincible > 0

        &&

        Math.floor(
            player.invincible / 6
        ) % 2 === 0

    ) {

        return;
    }


    const x =
        player.x -
        cameraX;

    const y =
        player.y;


    /* Hat */

    ctx.fillStyle =
        player.powered
        ? "#4a52d8"
        : "#d93632";


    ctx.fillRect(
        x + 4,
        y,
        24,
        8
    );


    ctx.fillRect(
        x,
        y + 6,
        32,
        6
    );


    /* Face */

    ctx.fillStyle =
        "#f0b27a";


    ctx.fillRect(
        x + 6,
        y + 11,
        20,
        17
    );


    /* Hair */

    ctx.fillStyle =
        "#47251c";


    ctx.fillRect(
        x + 4,
        y + 12,
        6,
        12
    );


    ctx.fillRect(
        x + 22,
        y + 11,
        6,
        9
    );


    /* Eye */

    ctx.fillStyle =
        "#111";


    if (
        player.facing === 1
    ) {

        ctx.fillRect(
            x + 20,
            y + 15,
            3,
            4
        );

    }

    else {

        ctx.fillRect(
            x + 9,
            y + 15,
            3,
            4
        );
    }


    /* Shirt */

    ctx.fillStyle =
        player.powered
        ? "#eee"
        : "#2e62c9";


    ctx.fillRect(
        x + 5,
        y + 27,
        22,
        9
    );


    /* Overalls */

    ctx.fillStyle =
        "#2951a8";


    ctx.fillRect(
        x + 7,
        y + 33,
        18,
        6
    );


    /* Legs */

    ctx.fillRect(
        x + 4,
        y + 38,
        9,
        4
    );


    ctx.fillRect(
        x + 19,
        y + 38,
        9,
        4
    );


    /* Shoes */

    ctx.fillStyle =
        "#542d20";


    ctx.fillRect(
        x,
        y + 40,
        13,
        4
    );


    ctx.fillRect(
        x + 20,
        y + 40,
        13,
        4
    );
}


/* =========================================================
   GOAL
   ========================================================= */

function drawGoal() {

    const x =
        goal.x -
        cameraX;


    ctx.fillStyle =
        "#ddd";


    ctx.fillRect(
        x,
        goal.y,
        goal.w,
        goal.h
    );


    ctx.fillStyle =
        "#ffdf3f";


    ctx.beginPath();


    ctx.moveTo(
        x + goal.w,
        goal.y
    );


    ctx.lineTo(
        x + goal.w + 55,
        goal.y + 25
    );


    ctx.lineTo(
        x + goal.w,
        goal.y + 50
    );


    ctx.closePath();


    ctx.fill();


    ctx.fillStyle =
        "#ddd";


    ctx.fillRect(
        x - 8,
        goal.y + goal.h,
        36,
        8
    );
}


/* =========================================================
   HUD
   ========================================================= */

function drawHUD() {

    ctx.fillStyle =
        "#fff";


    ctx.font =
        "bold 20px monospace";


    ctx.textAlign =
        "left";


    ctx.fillText(
        "SCORE " + score,
        25,
        30
    );


    ctx.fillText(
        "COINS " + coins,
        200,
        30
    );


    ctx.fillText(
        "LIVES " + lives,
        365,
        30
    );


    if (
        player.powered
    ) {

        ctx.fillStyle =
            "#ffe43d";


        ctx.fillText(
            "POWERED!",
            520,
            30
        );
    }
}


/* =========================================================
   PAUSE
   ========================================================= */

function drawPause() {

    ctx.fillStyle =
        "rgba(0,0,0,0.55)";


    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    ctx.fillStyle =
        "#fff";


    ctx.textAlign =
        "center";


    ctx.font =
        "bold 52px monospace";


    ctx.fillText(
        "PAUSED",
        WIDTH / 2,
        HEIGHT / 2
    );


    ctx.font =
        "20px monospace";


    ctx.fillText(
        "Press P to resume",
        WIDTH / 2,
        HEIGHT / 2 + 45
    );


    ctx.textAlign =
        "left";
}


/* =========================================================
   GAME OVER
   ========================================================= */

function drawGameOver() {

    ctx.fillStyle =
        "rgba(0,0,0,0.65)";


    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    ctx.fillStyle =
        "#fff";


    ctx.textAlign =
        "center";


    ctx.font =
        "bold 48px monospace";


    ctx.fillText(
        "GAME OVER",
        WIDTH / 2,
        HEIGHT / 2 - 20
    );


    ctx.font =
        "20px monospace";


    ctx.fillText(
        "Press R to restart",
        WIDTH / 2,
        HEIGHT / 2 + 30
    );


    ctx.textAlign =
        "left";
}


/* =========================================================
   WIN SCREEN
   ========================================================= */

function drawWin() {

    ctx.fillStyle =
        "rgba(0,0,0,0.55)";


    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    ctx.fillStyle =
        "#ffe43d";


    ctx.textAlign =
        "center";


    ctx.font =
        "bold 48px monospace";


    ctx.fillText(
        "LEVEL COMPLETE!",
        WIDTH / 2,
        HEIGHT / 2 - 30
    );


    ctx.fillStyle =
        "#fff";


    ctx.font =
        "20px monospace";


    ctx.fillText(
        "Score: " + score,
        WIDTH / 2,
        HEIGHT / 2 + 15
    );


    ctx.fillText(
        "Press R to play again",
        WIDTH / 2,
        HEIGHT / 2 + 50
    );


    ctx.textAlign =
        "left";
}


/* =========================================================
   DRAW EVERYTHING
   ========================================================= */

function draw() {

    drawBackground();

    drawPlatforms();

    drawBlocks();

    drawCoins();

    drawPowerUps();

    drawEnemies();

    drawGoal();

    drawPlayer();

    drawHUD();


    if (
        gameState === "paused"
    ) {

        drawPause();
    }


    if (
        gameState === "gameover"
    ) {

        drawGameOver();
    }


    if (
        gameState === "won"
    ) {

        drawWin();
    }
}


/* =========================================================
   RESTART
   ========================================================= */

function restartGame() {

    score = 0;

    coins = 0;

    lives = 3;

    gameState =
        "playing";


    player.powered =
        false;

    player.invincible =
        0;


    resetPlayer();


    for (
        const coin of coinObjects
    ) {

        coin.collected =
            false;
    }


    for (
        const enemy of enemies
    ) {

        enemy.alive =
            true;
    }


    for (
        const power of powerUps
    ) {

        power.collected =
            false;
    }


    for (
        const block of blocks
    ) {

        if (
            block.type ===
            "used"
        ) {

            block.type =
                "coin";
        }
    }
}


/* =========================================================
   GAME LOOP
   ========================================================= */

function gameLoop(timestamp) {

    lastTime =
        timestamp;


    update();

    draw();


    requestAnimationFrame(
        gameLoop
    );
}


requestAnimationFrame(
    gameLoop
);

</script>

</body>
</html>
